# License map for this repository (https://reuse.software/spec/).
# Upstream OpenRig code is Apache-2.0. Original work by kairin is AGPL-3.0-only.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Mike Schwarz and the OpenRig contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "README.md",
  "COMMERCIAL.md",
  "NOTICE",
  "LICENSE",
  "REUSE.toml",
  "breakdown/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 kairin"
SPDX-License-Identifier = "AGPL-3.0-only"

# Gemini Deep Research output kept for review. kairin does not claim copyright in it.
[[annotations]]
path = "breakdown/gemini-review/sources/**"
precedence = "override"
SPDX-FileCopyrightText = "Generated by Gemini Deep Research; quoted third-party material belongs to its owners"
SPDX-License-Identifier = "LicenseRef-Unlicensed-Third-Party"

# Upstream's original README, kept for reference.
[[annotations]]
path = "archive/documents/README-upstream-original.md"
precedence = "override"
SPDX-FileCopyrightText = "Mike Schwarz and the OpenRig contributors"
SPDX-License-Identifier = "Apache-2.0"
